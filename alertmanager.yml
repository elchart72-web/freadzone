global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'telegram'

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: '${TELEGRAM_BOT_TOKEN}'
        chat_id: ${TELEGRAM_CHAT_ID}
        message: |
          🚨 Сайт статусы: {{ .Status }}
          Alert: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
          Себебі: {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
        send_resolved: true
